name: Release Windows x86_64

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq \
            '.[] | select(.tag_name == env.TAG_NAME and .draft) | .id' | head -n 1)

          if [ -n "$release_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --method PATCH \
              -f name="Release ${TAG_NAME} (Windows x86_64)" \
              -F draft=true \
              -F prerelease=false >/dev/null
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Release ${TAG_NAME} (Windows x86_64)" \
              --draft \
              --notes ""
          fi

  build-release:
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - release
          - no-web
    env:
      RUST_BACKTRACE: 1
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          cache: false
          rustflags: ""

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build release binary
        if: matrix.variant == 'release'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release

      - name: Build release binary (no-web)
        if: matrix.variant == 'no-web'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release --no-web

      - name: Create release archive
        id: make-artifact
        shell: pwsh
        run: |
          $prefix = if ('${{ matrix.variant }}' -eq 'release') { 'zellij' } else { 'zellij-no-web' }
          $asset_name = "$prefix-$env:TARGET.zip"
          Compress-Archive -Path "target/release/zellij.exe" -DestinationPath $asset_name
          echo "asset_name=$asset_name" >> $env:GITHUB_OUTPUT

      - name: Create release checksum
        id: make-checksum
        shell: pwsh
        run: |
          $prefix = if ('${{ matrix.variant }}' -eq 'release') { 'zellij' } else { 'zellij-no-web' }
          $checksum_name = "$prefix-$env:TARGET.sha256sum"
          $hash = (Get-FileHash "target/release/zellij.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  target/release/zellij.exe" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ inputs.tag_name }}" "${{ steps.make-artifact.outputs.asset_name }}" --clobber --repo "${{ github.repository }}"

      - name: Upload release checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ inputs.tag_name }}" "${{ steps.make-checksum.outputs.checksum_name }}" --clobber --repo "${{ github.repository }}"

      - name: Install WiX v6
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add WiX UI extension
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer
        id: build-msi
        shell: pwsh
        run: |
          $prefix = if ('${{ matrix.variant }}' -eq 'release') { 'zellij' } else { 'zellij-no-web' }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $msi_name = "$prefix-$env:TARGET-installer.msi"
          $msi_path = "target\wix\$msi_name"
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\Zellij.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o $msi_path
          echo "msi_name=$msi_name" >> $env:GITHUB_OUTPUT
          echo "msi_path=$msi_path" >> $env:GITHUB_OUTPUT

      - name: Create MSI checksum
        id: make-checksum-msi
        shell: pwsh
        run: |
          $prefix = if ('${{ matrix.variant }}' -eq 'release') { 'zellij' } else { 'zellij-no-web' }
          $checksum_name = "$prefix-$env:TARGET-installer.sha256sum"
          $msi_name = "$prefix-$env:TARGET-installer.msi"
          $hash = (Get-FileHash "target\wix\$msi_name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $msi_name" | Out-File -Encoding ascii $checksum_name
          echo "checksum_name=$checksum_name" >> $env:GITHUB_OUTPUT

      - name: Upload MSI installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ inputs.tag_name }}" "${{ steps.build-msi.outputs.msi_path }}" --clobber --repo "${{ github.repository }}"

      - name: Upload MSI checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ inputs.tag_name }}" "${{ steps.make-checksum-msi.outputs.checksum_name }}" --clobber --repo "${{ github.repository }}"

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    if: ${{ needs.build-release.result == 'success' }}
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag_name }}" --draft=false --repo "${{ github.repository }}"
